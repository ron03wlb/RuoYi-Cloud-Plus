# ==========================================
# Gradle Version Catalog
# 集中管理所有依赖的版本
# ==========================================

[versions]
# ==========================================
# 核心框架版本
# ==========================================
springBoot = "3.5.6"
springCloud = "2025.0.0"
springCloudAlibaba = "2025.0.1.0"

# ==========================================
# 数据库相关
# ==========================================
mybatisPlus = "3.5.14"
mybatisPlusJoin = "1.5.6"
dynamic-datasource = "4.3.1"
hikaricp = "6.2.1"
p6spy = "3.9.1"
druid = "1.2.26"

# ==========================================
# 缓存 & 消息队列
# ==========================================
redisson = "3.51.0"
lock4j = "2.2.7"
easy-es = "3.0.0"

# ==========================================
# RPC & 服务治理
# ==========================================
dubbo = "3.3.5"
seata = "2.5.0"

# ==========================================
# 认证授权
# ==========================================
satoken = "1.44.0"
justAuth = "1.16.7"

# ==========================================
# 工具库
# ==========================================
hutool = "5.8.40"
lombok = "1.18.40"
mapstructPlus = "1.5.0"
easyExcel = "4.0.7"
fastexcel = "1.3.0"
velocity = "2.4.1"
snakeyaml = "2.3"
transmittable-thread-local = "2.15.0"
anyline = "8.7.2-20250603"
jedis = "5.2.0"

# ==========================================
# 对象存储
# ==========================================
minio = "8.5.19"
aws-java-sdk-s3 = "1.12.791"

# ==========================================
# 通信 & 通知
# ==========================================
okhttp = "4.12.0"
sms4j = "3.3.4"
email = "1.6.2"
rocketmq = "2.3.4"

# ==========================================
# 文档 & API
# ==========================================
springdoc = "2.7.0"
therapi-javadoc = "0.15.0"
mica = "2.7.6"

# ==========================================
# 监控 & 追踪
# ==========================================
logstash-logback-encoder = "8.0"
skywalking-toolkit = "9.3.0"

# ==========================================
# 工作流 & 定时任务
# ==========================================
warm-flow = "1.8.2"
snailjob = "1.8.0"

# ==========================================
# 其他依赖
# ==========================================
bouncycastle = "1.79"
jsqlparser = "5.0"
oshi = "6.6.5"
ip2region = "2.7.0"
bitwalker = "1.21"
commons-io = "2.18.0"

# ==========================================
# 测试框架版本
# ==========================================
# 注意：这些版本目前由 Spring Boot BOM 管理
# 如需覆盖 BOM 版本，可在 build.gradle.kts 中显式引用这些版本
junit = "5.12.2"
mockito = "5.17.0"
assertj = "3.27.4"

# ==========================================
# 插件版本
# ==========================================
springBootPlugin = "3.5.6"
jibPlugin = "3.4.4"
flattenPlugin = "1.6.0"

[libraries]
# ==========================================
# 注意：以下依赖由 BOM 管理版本，已从 version catalog 移除
# 使用时请直接用字符串格式，例如: api("org.springframework:spring-web")
# ==========================================
# Spring Framework: spring-context, spring-core, spring-web, spring-webmvc, spring-beans, spring-aop, spring-context-support
# Spring Boot: spring-boot, spring-boot-autoconfigure, spring-boot-starter-*
# Spring Cloud: spring-cloud-gateway-server, spring-cloud-starter-*, spring-cloud-context, spring-cloud-commons
# Spring Cloud Alibaba: spring-cloud-starter-alibaba-*
# 数据库驱动: mysql-connector-j, postgresql, ojdbc11, mssql-jdbc
# Jakarta EE: jakarta-servlet-api, jakarta-validation-api, jakarta-annotation-api
# Hibernate Validator: hibernate-validator
# 日志: slf4j-api
# Apache Commons: commons-lang3, commons-io
# Jackson: jackson-databind, jackson-datatype-jsr310, jackson-module-kotlin
# Reactor: reactor-core
# Caffeine: caffeine
# Redis: spring-boot-starter-data-redis
# ==========================================

# ==========================================
# MyBatis Plus
# ==========================================
mybatis-plus-spring-boot3-starter = { module = "com.baomidou:mybatis-plus-spring-boot3-starter", version.ref = "mybatisPlus" }
mybatis-plus-annotation = { module = "com.baomidou:mybatis-plus-annotation", version.ref = "mybatisPlus" }
mybatis-plus-extension = { module = "com.baomidou:mybatis-plus-extension", version.ref = "mybatisPlus" }
mybatis-plus-jsqlparser = { module = "com.baomidou:mybatis-plus-jsqlparser", version.ref = "mybatisPlus" }
mybatis-plus-join = { module = "com.github.yulichang:mybatis-plus-join-boot-starter", version.ref = "mybatisPlusJoin" }
dynamic-datasource = { module = "com.baomidou:dynamic-datasource-spring-boot3-starter", version.ref = "dynamic-datasource" }

# ==========================================
# 数据库连接池 & 工具
# ==========================================
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
p6spy = { module = "p6spy:p6spy", version.ref = "p6spy" }
druid = { module = "com.alibaba:druid-spring-boot-3-starter", version.ref = "druid" }
jsqlparser = { module = "com.github.jsqlparser:jsqlparser", version.ref = "jsqlparser" }

# ==========================================
# Redis & Redisson
# ==========================================
# spring-boot-starter-data-redis 由 Spring Boot BOM 管理，使用字符串格式引用
redisson = { module = "org.redisson:redisson-spring-boot-starter", version.ref = "redisson" }
lock4j = { module = "com.baomidou:lock4j-redisson-spring-boot-starter", version.ref = "lock4j" }

# ==========================================
# Dubbo
# ==========================================
dubbo = { module = "org.apache.dubbo:dubbo", version.ref = "dubbo" }
dubbo-spring-boot-starter = { module = "org.apache.dubbo:dubbo-spring-boot-starter", version.ref = "dubbo" }
dubbo-spring-boot-starter3 = { module = "org.apache.dubbo:dubbo-spring-boot-starter3", version.ref = "dubbo" }
dubbo-spring-boot-actuator = { module = "org.apache.dubbo:dubbo-spring-boot-actuator", version.ref = "dubbo" }
dubbo-nacos-spring-boot-starter = { module = "com.alibaba.cloud:dubbo-nacos-spring-boot-starter" }
# Dubbo Extensions - 版本由 ruoyi-common-alibaba-bom 管理
dubbo-metadata-report-redis = { module = "org.apache.dubbo.extensions:dubbo-metadata-report-redis" }
dubbo-filter-seata = { module = "org.apache.dubbo.extensions:dubbo-filter-seata" }

# ==========================================
# Seata 分布式事务
# ==========================================
seata-spring-boot-starter = { module = "org.apache.seata:seata-spring-boot-starter", version.ref = "seata" }

# ==========================================
# Sa-Token 认证授权
# ==========================================
sa-token-core = { module = "cn.dev33:sa-token-core", version.ref = "satoken" }
sa-token-spring-boot3-starter = { module = "cn.dev33:sa-token-spring-boot3-starter", version.ref = "satoken" }
sa-token-reactor-spring-boot3-starter = { module = "cn.dev33:sa-token-reactor-spring-boot3-starter", version.ref = "satoken" }
sa-token-redis-jackson = { module = "cn.dev33:sa-token-redis-jackson", version.ref = "satoken" }
sa-token-jwt = { module = "cn.dev33:sa-token-jwt", version.ref = "satoken" }
sa-token-dubbo3 = { module = "cn.dev33:sa-token-dubbo3", version.ref = "satoken" }

# ==========================================
# JustAuth 第三方登录
# ==========================================
justauth = { module = "me.zhyd.oauth:JustAuth", version.ref = "justAuth" }
justauth-spring-boot3-starter = { module = "com.xkcoding.justauth:justauth-spring-boot3-starter", version.ref = "justAuth" }

# ==========================================
# Hutool 工具库
# ==========================================
hutool-core = { module = "cn.hutool:hutool-core", version.ref = "hutool" }
hutool-http = { module = "cn.hutool:hutool-http", version.ref = "hutool" }
hutool-crypto = { module = "cn.hutool:hutool-crypto", version.ref = "hutool" }
hutool-extra = { module = "cn.hutool:hutool-extra", version.ref = "hutool" }
hutool-captcha = { module = "cn.hutool:hutool-captcha", version.ref = "hutool" }

# ==========================================
# Lombok & MapStruct
# ==========================================
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct-plus-spring-boot-starter = { module = "io.github.linpeilie:mapstruct-plus-spring-boot-starter", version.ref = "mapstructPlus" }

# ==========================================
# Excel 处理
# ==========================================
easyexcel = { module = "com.alibaba:easyexcel", version.ref = "easyExcel" }
fastexcel = { module = "cn.idev.excel:fastexcel", version.ref = "fastexcel" }

# ==========================================
# API 文档
# ==========================================
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
springdoc-openapi-starter-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
springdoc-openapi-starter-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }
therapi-runtime-javadoc = { module = "com.github.therapi:therapi-runtime-javadoc", version.ref = "therapi-javadoc" }
mica-metrics = { module = "net.dreamlu:mica-metrics", version.ref = "mica" }
mica-core = { module = "net.dreamlu:mica-core", version.ref = "mica" }

# ==========================================
# 对象存储
# ==========================================
minio = { module = "io.minio:minio", version.ref = "minio" }
aws-java-sdk-s3 = { module = "com.amazonaws:aws-java-sdk-s3", version.ref = "aws-java-sdk-s3" }

# ==========================================
# 消息队列（按需选择）
# ==========================================
# spring-boot-starter-amqp 和 spring-kafka 由 Spring Boot BOM 管理
rocketmq-spring-boot-starter = { module = "org.apache.rocketmq:rocketmq-spring-boot-starter", version.ref = "rocketmq" }

# ==========================================
# 工作流引擎
# ==========================================
warm-flow-mybatis-plus-sb-starter = { module = "org.dromara.warm-flow:warm-flow-mybatis-plus-sb-starter", version.ref = "warm-flow" }

# ==========================================
# 定时任务
# ==========================================
snailjob-client-starter = { module = "com.aizuda:snail-job-client-starter", version.ref = "snailjob" }

# ==========================================
# ElasticSearch
# ==========================================
easy-es-boot-starter = { module = "org.dromara.easy-es:easy-es-boot-starter", version.ref = "easy-es" }

# ==========================================
# 监控日志
# ==========================================
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback-encoder" }
skywalking-toolkit-logback = { module = "org.apache.skywalking:apm-toolkit-logback-1.x", version.ref = "skywalking-toolkit" }
skywalking-toolkit-trace = { module = "org.apache.skywalking:apm-toolkit-trace", version.ref = "skywalking-toolkit" }

# ==========================================
# 其他工具
# ==========================================
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
sms4j-spring-boot-starter = { module = "org.dromara.sms4j:sms4j-spring-boot-starter", version.ref = "sms4j" }
email = { module = "org.apache.commons:commons-email", version.ref = "email" }
velocity-engine-core = { module = "org.apache.velocity:velocity-engine-core", version.ref = "velocity" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
transmittable-thread-local = { module = "com.alibaba:transmittable-thread-local", version.ref = "transmittable-thread-local" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-jdk15to18 = { module = "org.bouncycastle:bcprov-jdk15to18", version.ref = "bouncycastle" }
oshi-core = { module = "com.github.oshi:oshi-core", version.ref = "oshi" }
ip2region = { module = "org.lionsoul:ip2region", version.ref = "ip2region" }
bitwalker = { module = "eu.bitwalker:UserAgentUtils", version.ref = "bitwalker" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }
anyline-environment-spring-data-jdbc = { module = "org.anyline:anyline-environment-spring-data-jdbc", version.ref = "anyline" }
anyline-data-jdbc-mysql = { module = "org.anyline:anyline-data-jdbc-mysql", version.ref = "anyline" }

# ==========================================
# 测试依赖库
# ==========================================
# 注意：这些依赖目前由 Spring Boot BOM 管理版本
# 仅在需要覆盖 BOM 版本时才使用这些显式声明
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# ==========================================
# 注意：以下依赖全部由 Spring Boot BOM 管理，已从 version catalog 移除
# reactor-core, caffeine, slf4j-api
# jakarta-servlet-api, jakarta-validation-api, jakarta-annotation-api, hibernate-validator
# jackson-databind, jackson-datatype-jsr310, jackson-module-kotlin
# commons-lang3
# ==========================================

[bundles]
# ==========================================
# 常用依赖组合（Bundle）
# ==========================================
# 注意：由于 BOM 管理的依赖已从 version catalog 移除，
# 以下 bundles 也被移除。请在 build.gradle.kts 中直接声明依赖。
# ==========================================

# MyBatis Plus 全家桶（保留，有显式版本）
mybatis-plus = [
    "mybatis-plus-spring-boot3-starter",
    "mybatis-plus-annotation",
    "mybatis-plus-extension",
    "mybatis-plus-join",
    "dynamic-datasource"
]

# Hutool 常用模块（保留，有显式版本）
hutool = [
    "hutool-core",
    "hutool-http",
    "hutool-crypto",
    "hutool-extra"
]

# Sa-Token 认证（保留，有显式版本）
satoken = [
    "sa-token-core",
    "sa-token-spring-boot3-starter",
    "sa-token-redis-jackson"
]

# API 文档（保留，有显式版本）
api-docs = [
    "springdoc-openapi-starter-webmvc-ui",
    "therapi-runtime-javadoc"
]

# 测试依赖组合（可选使用）
# 注意：这些依赖目前由 Spring Boot BOM 管理，通常无需显式引用
# 仅在需要覆盖 BOM 版本时才使用此 bundle
test-core = [
    "junit-jupiter",
    "junit-jupiter-params",
    "mockito-core",
    "mockito-junit-jupiter",
    "assertj-core"
]

[plugins]
# ==========================================
# Gradle 插件
# ==========================================

# Spring Boot 插件
spring-boot = { id = "org.springframework.boot", version.ref = "springBootPlugin" }

# Jib Docker 镜像构建插件
jib = { id = "com.google.cloud.tools.jib", version.ref = "jibPlugin" }

# Flatten 插件（处理版本占位符）
flatten = { id = "org.springframework.boot.experimental.thin-launcher", version.ref = "flattenPlugin" }
