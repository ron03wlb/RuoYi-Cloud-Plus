# ==========================================
# Gradle 项目配置
# ==========================================
# 项目版本（对应 Maven 的 ${revision}）
version=2.5.0
# Java 版本配置
javaVersion=21
sourceCompatibility=21
targetCompatibility=21
# 编码设置
encoding=UTF-8
# ==========================================
# Gradle 性能优化配置
# ==========================================
# 启用 Gradle 构建缓存（加速增量构建）
org.gradle.caching=true
# 启用并行构建（利用多核 CPU）
org.gradle.parallel=true
# 启用配置缓存（实验性功能，大幅提升构建速度）
# 暂时禁用，因为 ProcessResources 任务中的 Project 对象引用导致序列化问题
org.gradle.configuration-cache=false
# JVM 参数优化
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# 启用 Gradle Daemon（守护进程）
org.gradle.daemon=true
# ==========================================
# Nacos 配置（可通过环境变量覆盖）
# ==========================================
# Nacos 服务器地址
nacosServer=127.0.0.1:8848
# Nacos 用户名/密码
nacosUsername=nacos
nacosPassword=nacos
# Nacos 命名空间（留空表示 public）
nacosNamespace=
# Nacos 配置组
nacosConfigGroup=DEFAULT_GROUP
# ==========================================
# 环境配置
# ==========================================
# 激活的配置文件（dev/prod）
# 注意：根据需求 4，配置将完全依赖 Nacos，此处仅作标识
profilesActive=dev
# ==========================================
# 依赖版本管理（主要版本在 libs.versions.toml 中定义）
# ==========================================
# 此文件主要用于项目级别的配置，详细的依赖版本管理请参考 gradle/libs.versions.toml
