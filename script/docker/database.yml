services:
  # PostgreSQL 17 - 主数据库
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ruoyi123
      POSTGRES_DB: ry-cloud
    ports:
      - "5432:5432"
    volumes:
      - /docker/postgres/data:/var/lib/postgresql/data
      - /docker/postgres/conf:/etc/postgresql
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    privileged: true
    network_mode: "host"
